name: Publish Docker image

# Builds and pushes the Docker image to Docker Hub whenever the version in
# package.json changes on main. A version bump is the deliberate signal that
# a release is ready — every other push to main (a doc fix, a dependency
# bump) leaves the image alone.
#
# Requires two repository secrets (Settings -> Secrets and variables ->
# Actions): DOCKERHUB_USERNAME and DOCKERHUB_TOKEN (a Docker Hub access
# token, not your account password).

on:
  push:
    branches: [main]
    paths:
      - package.json
  workflow_dispatch: {} # manual re-run, e.g. to republish after a secrets fix

env:
  IMAGE_NAME: theaob/game-collection-tracker

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false # never cancel a publish that's already pushing tags

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2 # need the previous commit to diff package.json against

      - id: check
        run: |
          current="$(jq -r .version package.json)"
          if [ -z "$current" ] || [ "$current" = "null" ]; then
            echo "package.json has no version field" >&2
            exit 1
          fi

          previous=""
          if git cat-file -e HEAD^:package.json 2>/dev/null; then
            previous="$(git show HEAD^:package.json | jq -r .version)"
          fi

          echo "version=$current" >> "$GITHUB_OUTPUT"
          if [ "$current" != "$previous" ]; then
            echo "Version changed: '$previous' -> '$current'"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Version unchanged ('$current'); skipping the image build."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  build-and-push:
    needs: check-version
    if: github.event_name == 'workflow_dispatch' || needs.check-version.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ needs.check-version.outputs.version }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
